; PlatformIO Project Configuration File
; CHPC ESP32 Heat Pump Controller
; Migration from Arduino Pro Mini to ESP32 with Home Assistant integration

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Library dependencies
lib_deps = 
    paulstoffregen/OneWire@^2.3.7
    milesburton/DallasTemperature@^3.11.0
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^6.21.3
    marcoschwartz/LiquidCrystal_I2C@^1.1.4
    ; For async web server and OTA
    https://github.com/mathieucarbou/AsyncTCP#v3.2.14
    https://github.com/mathieucarbou/ESPAsyncWebServer#v3.3.23

; Build flags
build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_ESP32_DEV
    -DBOARD_HAS_PSRAM=0

; Partition scheme for OTA support
board_build.partitions = min_spiffs.csv

; File system
board_build.filesystem = littlefs
